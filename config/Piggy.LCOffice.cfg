[General]

## When enabled, enables custom scrap spawning.
# Setting type: Boolean
# Default value: true
OfficeCustomScrap = true

## The number of main paths the interior generates. (Main paths will be longer than other paths. Increasing this number increases the size of the dungeon but makes the distribution between elevator floors larger) (When set to "One" switches size and branch count numbers back similar to the 2.0.0 version.)
# Setting type: PathCount
# Default value: Two
# Acceptable values: One, Two, Three
MainDungeonPaths = Two

## Set the volume of music played in the elevator. (0 - 100)
# Setting type: Single
# Default value: 100
ElevatorMusicVolume = 100

## Change the pitch of the elevator music. (bc i like it)
# Setting type: Boolean
# Default value: false
ElevatorMusicPitchDown = true

## Disable cameras inside the office.
# Setting type: Boolean
# Default value: false
Disable Camera = false

## Specifies the camera speed inside the office. When set to a negative value uses the game's frame rate. (FPS)
# Setting type: Int32
# Default value: 10
Camera Frame Speed = 20

OfficeRarity = 40

OfficeGuaranteed = false

OfficeMoonsList = free

OfficeLengthOverride = -1

DisableCameraShake = false

DiversityHaltBrighness = true

EmergencyPowerSystem = false

[Spawn]

ShrimpSpawnWeight = 5

HaltSpawnPropability = 0

[Translation]

Enable Korean = false

